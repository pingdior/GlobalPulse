name: Deploy to Tencent Cloud

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup & Build Frontend
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install & Build Frontend
        run: |
          cd frontend
          flutter pub get
          flutter build web --release

      # 2. Deploy Files via SCP
      - name: Copy Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}
          # Copy built web files AND backend code
          source: "frontend/build/web/*,backend/*,deploy/nginx.conf,backend/.env.example,backend/requirements.txt"
          target: "/var/www/globalpulse_temp"
          strip_components: 0

      # 3. Configure & Restart via SSH
      - name: Remote Configuration & Restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USERNAME }}
          password: ${{ secrets.TENCENT_PASSWORD }}
          script: |
            # --- Organization ---
            # Move Frontend Files
            rm -rf /var/www/globalpulse/web/*
            mkdir -p /var/www/globalpulse/web
            cp -r /var/www/globalpulse_temp/frontend/build/web/* /var/www/globalpulse/web/
            
            # Move Backend Files
            mkdir -p /var/www/globalpulse/backend
            cp -r /var/www/globalpulse_temp/backend/* /var/www/globalpulse/backend/
            
            # --- Nginx Setup ---
            cp /var/www/globalpulse_temp/deploy/nginx.conf /etc/nginx/conf.d/globalpulse.conf
            # Disable default config if exists (CentOS generic)
            mv /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/default.conf.bak || true
            
            # Restart Nginx
            nginx -t && systemctl reload nginx || systemctl restart nginx

            # --- Backend Setup ---
            cd /var/www/globalpulse/backend
            
            # Inject Secret
            echo "DASHSCOPE_API_KEY=${{ secrets.DASHSCOPE_API_KEY }}" > .env
            
            # Virtualenv
            if [ ! -d "venv" ]; then
                python3 -m venv venv
            fi
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Stop existing uvicorn (Simple kill for demo)
            pkill -f "uvicorn app.main:app" || true
            
            # Start Backend (nohup for background)
            nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
            
            # Cleanup
            rm -rf /var/www/globalpulse_temp
            
            echo "✅ Deployment Complete!"
