name: Deploy to Tencent Cloud

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Backend Test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          
      # Frontend Build
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          flutter pub get
          
      - name: Build Flutter Web
        run: |
          cd frontend
          flutter build web --release

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      
      # Example: Deploy via SSH to Tencent Cloud CVM
      # You need to configure secrets in GitHub Repo Settings:
      # TENCENT_HOST: Your server IP
      # TENCENT_USERNAME: 'root' or 'ubuntu'
      # TENCENT_SSH_KEY: Your private SSH key
      
      - name: Deploy to Tencent Cloud
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.TENCENT_HOST }}
          username: ${{ secrets.TENCENT_USERNAME }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          script: |
            # Pull latest changes
            cd /path/to/your/project
            git pull origin main
            
            # Backend: Restart Service (Example with restart script or docker)
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            # restart your systemd service or pm2 or docker container
            # systemctl restart globalpulse-backend
            
            # Frontend: Update web files (Example: copy build artifacts)
            # You might need to SCP the 'build/web' folder if you prefer building on CI
            # For this example, we assume you might just build on server or host static files
            echo "Deployment script executed!"
